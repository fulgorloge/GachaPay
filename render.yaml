services:
  - type: web
    name: gachahub-app
    env: node
    buildCommand: npm install && npx prisma db push
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: gachahub-db
          property: connectionString
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: PLATFORM_FEE_PERCENT
        value: 10
      - key: DOMAIN
        sync: false

databases:
  - name: gachahub-db
    databaseName: gachahub
    user: gachahub_user
