<!DOCTYPE html>
<html lang="es" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GachaPay - Multijuego Creator Hub</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans min-h-screen p-4 sm:p-8 flex flex-col items-center justify-center">

  <div class="max-w-xl w-full bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl">
    <h1 class="text-2xl font-black text-amber-400 mb-6 text-center tracking-wide">GACHAPAY HUB</h1>
    
    <!-- Formulario para Crear Perfil Anónimo y Minijuego -->
    <div id="creatorSetup" class="flex flex-col gap-4">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">1. Crea tu perfil y elige tu minijuego</h2>
      <input type="text" id="creatorName" placeholder="Tu Nombre / Canal" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
      <input type="text" id="creatorSlug" placeholder="URL única (ej: tu-nombre)" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
      
      <select id="gameTypeSelect" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-slate-300 focus:outline-none focus:border-amber-500">
        <option value="ROULETTE">1. Ruleta de Neón</option>
        <option value="CHEST">2. Cofre del Tesoro Arcano</option>
        <option value="SCRATCH">3. Raspa y Gana de Lujo</option>
        <option value="SLOTS">4. Tragamonedas Clásico</option>
        <option value="CRYSTAL">5. Esfera de Cristal Adivinatoria</option>
        <option value="LOTTO">6. Lotería de Píxeles</option>
        <option value="RPS">7. Piedra Papel o Tijera Épico</option>
        <option value="PLINKO">8. Plinko de la Suerte</option>
        <option value="TOWER">9. Torre de Cartas</option>
        <option value="COIN">10. Lanza-Monedas Cuántico</option>
      </select>

      <button onclick="createCreator()" class="py-3 bg-amber-500 hover:bg-amber-400 text-black font-black rounded-xl transition shadow-lg shadow-amber-500/10">Crear mi Link Independiente</button>
    </div>

    <!-- Panel de Gestión y Multimedia -->
    <div id="dashboard" class="hidden flex flex-col gap-4 mt-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-amber-400">¡Tu link está listo para compartir!</h2>
      <input type="text" id="shareLink" readonly class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-xs text-amber-200 select-all">
      
      <div class="border-t border-slate-800 pt-4 mt-2 flex flex-col gap-3">
        <h3 class="text-xs font-bold uppercase tracking-wider text-slate-400">2. Agrega Premios Multimedia (Foto, Video, Archivo)</h3>
        <input type="text" id="rewardName" placeholder="Nombre del Premio (Ej: Wallpaper Exclusivo)" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
        <select id="rewardRarity" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
          <option value="C">Común (C)</option>
          <option value="R">Raro (R)</option>
          <option value="SR">Super Raro (SR)</option>
          <option value="SSR">Ultra Raro (SSR)</option>
        </select>
        <input type="text" id="mediaUrl" placeholder="URL directa del Archivo, Foto o Video" class="p-3 bg-slate-950 border border-slate-800 rounded-xl text-sm text-white focus:outline-none focus:border-amber-500">
        
        <button onclick="addReward()" class="py-3 bg-slate-800 hover:bg-slate-700 font-bold rounded-xl text-sm transition border border-slate-700">Añadir Premio al Juego</button>
      </div>
    </div>
  </div>

  <script>
    let currentCreatorId = null;

    async function createCreator() {
      const name = document.getElementById('creatorName').value;
      const slug = document.getElementById('creatorSlug').value;
      const gameType = document.getElementById('gameTypeSelect').value;

      if (!name || !slug) {
        alert('Por favor completa todos los campos.');
        return;
      }

      try {
        const res = await fetch('/api/creators', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, slug, gameType })
        });
        
        const data = await res.json();
        
        if (res.ok && data.id) {
          currentCreatorId = data.id;
          document.getElementById('creatorSetup').classList.add('hidden');
          document.getElementById('dashboard').classList.remove('hidden');
          document.getElementById('shareLink').value = `${window.location.origin}/play.html?c=${slug}`;
        } else {
          alert('Error: ' + (data.error || 'No se pudo crear el perfil'));
        }
      } catch (err) {
        alert('Error de conexión con el servidor: ' + err.message);
      }
    }

    async function addReward() {
      const name = document.getElementById('rewardName').value;
      const rarity = document.getElementById('rewardRarity').value;
      const mediaUrl = document.getElementById('mediaUrl').value;

      if (!name || !mediaUrl) {
        alert('Ingresa el nombre y la URL del archivo multimedia.');
        return;
      }

      try {
        const res = await fetch(`/api/creators/${currentCreatorId}/rewards`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name, rarity, mediaUrl, mediaType: 'MEDIA' })
        });
        
        if (res.ok) {
          alert('¡Premio multimedia agregado con éxito!');
          document.getElementById('rewardName').value = '';
          document.getElementById('mediaUrl').value = '';
        } else {
          alert('Error al guardar el premio.');
        }
      } catch (err) {
        alert('Error de red al registrar el premio.');
      }
    }
  </script>
</body>
</html>
